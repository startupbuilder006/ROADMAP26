<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roadmap 2026 - Fablab & Orange Fab</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
        :root {
            --orange: #ff7900;
            --black: #000000;
            --dark: #1b1b1b;
            --gray: #1f1f1f;
            --text: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #000, #111);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        a { color: inherit; text-decoration: none; }

        .main {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: linear-gradient(90deg, #000, #222);
            border-bottom: 3px solid var(--orange);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 6px;
            background: var(--orange);
            color: #000;
            display: grid;
            place-items: center;
            font-size: 18px;
            font-weight: 800;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .logo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
        }

        .logo-subtitle {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--orange);
        }

        .tabs {
            display: flex;
            gap: 10px;
        }

        .tab {
            padding: 12px 18px;
            border-radius: 10px;
            border: 2px solid transparent;
            background: #222;
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.2s ease;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
        }

        .tab:hover { border-color: var(--orange); }
        .tab.active { background: var(--orange); color: #000; }

        .menu-toggle {
            display: none;
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 8px;
            background: var(--orange);
            color: #000;
            font-size: 18px;
            cursor: pointer;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--gray);
            border-right: 2px solid var(--orange);
            padding: 18px;
            overflow-y: auto;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5);
        }

        .sidebar-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--orange);
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid #333;
        }

        .slide-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .slide-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: #161616;
            border-left: 4px solid transparent;
            border-radius: 8px;
            color: #d0d0d0;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .slide-item:hover { background: #222; }
        .slide-item.active {
            background: linear-gradient(90deg, var(--orange), #ff9a32);
            color: #000;
            border-left-color: #000;
            box-shadow: 0 6px 18px rgba(255, 121, 0, 0.35);
        }

        .slide-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--orange);
            color: #000;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 12px;
            flex-shrink: 0;
        }

        .slide-item.active .slide-badge { background: #000; color: var(--orange); }

        /* Viewer */
        .viewer {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: #000;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        .frame-box {
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background: #000; /* Changed from #fff to #000 to fix white space issue */
            border-radius: 8px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .frame-box iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Controls */
        .controls {
            position: absolute;
            bottom: 18px;
            display: flex;
            gap: 14px;
            z-index: 5;
        }

        .ctrl-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: var(--orange);
            color: #000;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 121, 0, 0.35);
            transition: 0.2s ease;
        }

        .ctrl-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .ctrl-btn:hover:not(:disabled) { transform: translateY(-2px); }

        .counter {
            position: absolute;
            top: 14px;
            right: 18px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--orange);
            color: #fff;
            padding: 8px 14px;
            border-radius: 14px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
        }

        .loading {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.35);
            color: var(--orange);
            font-weight: 800;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
            z-index: 4;
        }

        .loading.active { display: flex; }

        /* Mobile */
        @media (max-width: 960px) {
            body { overflow: auto; }
            .main { flex-direction: column; }
            .header { gap: 10px; }
            .tabs { flex: 1; justify-content: flex-end; }
            .menu-toggle { display: block; }

            .sidebar {
                position: absolute;
                top: 70px;
                left: 0;
                height: calc(100vh - 70px);
                z-index: 20;
                transform: translateX(-100%);
                transition: 0.25s ease;
            }

            .sidebar.open { transform: translateX(0); }

            .viewer {
                padding: 12px;
                min-height: calc(100vh - 90px);
            }

            .frame-box {
                width: 100%;
                max-width: 100%;
                aspect-ratio: 16 / 9;
                max-height: calc(100vh - 160px);
            }

            .controls { bottom: 10px; }
            .counter { top: 10px; right: 12px; }
        }

        @media (max-width: 560px) {
            .header { padding: 12px 14px; }
            .logo-title { font-size: 18px; }
            .logo-subtitle { font-size: 10px; letter-spacing: 1px; }
            .tab { padding: 9px 12px; font-size: 12px; }
            .viewer { padding: 8px; }
            .controls { bottom: 8px; }
            .ctrl-btn { width: 42px; height: 42px; }
            .frame-box { max-height: calc(100vh - 150px); }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-road"></i></div>
            <div class="logo-text">
                <span class="logo-title">Roadmap 2026</span>
                <span class="logo-subtitle">STRATÉGIQUE</span>
            </div>
        </div>

        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>

        <div class="tabs">
            <button class="tab active" data-program="Fablab"><i class="fas fa-network-wired"></i> FABLAB</button>
            <button class="tab" data-program="Orange Fab"><i class="fas fa-rocket"></i> ORANGE FAB</button>
        </div>
    </header>

    <div class="main">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title" id="programTitle">Fablab Slides</div>
            <ul class="slide-list" id="slideList"></ul>
        </aside>

        <section class="viewer">
            <div class="counter"><span id="currentSlide">1</span> / <span id="totalSlides">0</span></div>
            <div class="loading" id="loading">Chargement...</div>
            <div class="frame-box">
                <iframe id="slideIframe" srcdoc="<div style='display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-family:Montserrat;font-size:22px;color:#ff7900;'>Sélectionnez un slide</div>"></iframe>
            </div>
            <div class="controls">
                <button class="ctrl-btn" id="prevBtn" aria-label="Précédent"><i class="fas fa-chevron-left"></i></button>
                <button class="ctrl-btn" id="nextBtn" aria-label="Suivant"><i class="fas fa-chevron-right"></i></button>
            </div>
        </section>
    </div>

    <script>
        const programs = {
            'Fablab': { folder: 'Fablab', slides: 9 },
            'Orange Fab': { folder: 'Orange Fab', slides: 11 }
        };

        let currentProgram = 'Fablab';
        let currentIndex = 0;

        const slideList = document.getElementById('slideList');
        const programTitle = document.getElementById('programTitle');
        const tabs = document.querySelectorAll('.tab');
        const slideIframe = document.getElementById('slideIframe');
        const loading = document.getElementById('loading');
        const currentSlideEl = document.getElementById('currentSlide');
        const totalSlidesEl = document.getElementById('totalSlides');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');

        function buildList() {
            const cfg = programs[currentProgram];
            totalSlidesEl.textContent = cfg.slides;
            programTitle.textContent = `${currentProgram} Slides`;
            slideList.innerHTML = '';
            for (let i = 1; i <= cfg.slides; i++) {
                const li = document.createElement('li');
                li.className = 'slide-item';
                if (i === 1) li.classList.add('active');
                li.innerHTML = `<span class=\"slide-badge\">${i}</span><span>Slide ${i}</span>`;
                li.addEventListener('click', () => loadSlide(i - 1));
                slideList.appendChild(li);
            }
        }

        function setActive(index) {
            document.querySelectorAll('.slide-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
        }

        function loadSlide(index) {
            const cfg = programs[currentProgram];
            if (index < 0 || index >= cfg.slides) return;
            currentIndex = index;
            setActive(index);
            currentSlideEl.textContent = index + 1;
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === cfg.slides - 1;

            const slidePath = `${cfg.folder}/Slide ${index + 1}.txt`;
            loading.classList.add('active');
            fetch(slidePath)
                .then(r => { if (!r.ok) throw new Error('not found'); return r.text(); })
                .then(html => {
                    slideIframe.srcdoc = html;
                    // Wait for iframe to load to apply scaling
                    slideIframe.onload = () => {
                        scaleSlide();
                    };
                })
                .catch(() => {
                    slideIframe.srcdoc = `<div style=\"display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-family:Montserrat;color:#ff7900;\">Erreur de chargement</div>`;
                })
                .finally(() => loading.classList.remove('active'));
        }

        function scaleSlide() {
            const iframe = document.getElementById('slideIframe');
            if (!iframe) return;
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                
                // Try to find the main container
                // Fablab uses .slide-container
                // Orange Fab uses .w-[1280px]
                let container = doc.querySelector('.slide-container') || doc.querySelector('.w-\\[1280px\\]');
                
                // Fallback: try the first div in body if it looks like a slide wrapper
                if (!container) {
                    const firstDiv = doc.body.firstElementChild;
                    if (firstDiv && firstDiv.tagName === 'DIV') {
                        container = firstDiv;
                    }
                }

                if (container) {
                    const wrapper = document.querySelector('.frame-box');
                    const availableWidth = wrapper.offsetWidth;
                    const availableHeight = wrapper.offsetHeight;
                    
                    const scaleX = availableWidth / 1280;
                    const scaleY = availableHeight / 720;
                    const scale = Math.min(scaleX, scaleY);
                    
                    // Calculate centering offsets
                    const offsetX = (availableWidth - (1280 * scale)) / 2;
                    const offsetY = (availableHeight - (720 * scale)) / 2;
                    
                    // Force styles to ensure correct positioning and scaling
                    container.style.width = '1280px';
                    container.style.height = '720px';
                    container.style.transform = `scale(${scale})`;
                    container.style.transformOrigin = 'top left';
                    container.style.position = 'absolute';
                    container.style.top = `${offsetY}px`;
                    container.style.left = `${offsetX}px`;
                    container.style.margin = '0';
                    
                    // Clean up body
                    doc.body.style.overflow = 'hidden';
                    doc.body.style.margin = '0';
                    doc.body.style.padding = '0';
                    doc.body.style.width = '100%';
                    doc.body.style.height = '100%';
                    
                    // Optional: Hide scrollbars explicitly
                    doc.documentElement.style.overflow = 'hidden';
                }
            } catch (e) {
                console.error('Cannot scale slide:', e);
            }
        }

        function switchProgram(name) {
            currentProgram = name;
            tabs.forEach(t => t.classList.toggle('active', t.dataset.program === name));
            buildList();
            loadSlide(0);
            closeSidebar();
        }

        function toggleSidebar() { sidebar.classList.toggle('open'); }
        function closeSidebar() { sidebar.classList.remove('open'); }

        tabs.forEach(tab => tab.addEventListener('click', () => switchProgram(tab.dataset.program)));
        prevBtn.addEventListener('click', () => loadSlide(currentIndex - 1));
        nextBtn.addEventListener('click', () => loadSlide(currentIndex + 1));
        menuToggle.addEventListener('click', toggleSidebar);
        window.addEventListener('resize', scaleSlide);

        document.addEventListener('click', (e) => {
            if (window.innerWidth > 960) return;
            if (!sidebar.contains(e.target) && !menuToggle.contains(e.target)) closeSidebar();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') loadSlide(currentIndex - 1);
            if (e.key === 'ArrowRight') loadSlide(currentIndex + 1);
            if (e.key === 'Escape') closeSidebar();
        });

        buildList();
        loadSlide(0);
    </script>
</body>
</html>
